name: BASOUL Android Preview Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/basoul-android-preview-build.yml
      - mobile/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-preview:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify checked-out release candidate identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Expected source commit: $TARGET_SHA"
          echo "Checked-out source commit: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Verify Expo authentication
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx eas-cli@latest whoami --non-interactive
      - name: Validate BASOUL identity boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const app = require('./app.json').expo;
          const expected = {
            name: 'BASOUL',
            slug: 'yosseuf-os',
            scheme: 'yosseufos',
            androidPackage: 'com.yosseufradwan.os',
            easProjectId: '6f770730-8c8e-49b0-81b9-f9773faf567a',
          };
          if (app.name !== expected.name) throw new Error(`Unexpected app name: ${app.name}`);
          if (app.slug !== expected.slug) throw new Error(`Unexpected slug: ${app.slug}`);
          if (app.scheme !== expected.scheme) throw new Error(`Unexpected scheme: ${app.scheme}`);
          if (app.android?.package !== expected.androidPackage) throw new Error(`Unexpected Android package: ${app.android?.package}`);
          if (app.extra?.eas?.projectId !== expected.easProjectId) throw new Error(`Unexpected EAS projectId: ${app.extra?.eas?.projectId}`);
          console.log('BASOUL Android identity boundary verified.');
          NODE
      - name: Run Expo Doctor
        run: npm run doctor
      - name: Queue Android preview build on EAS
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json | tee /tmp/eas-build.json
          TARGET_SHA="$TARGET_SHA" node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/eas-build.json', 'utf8').trim();
          const data = JSON.parse(raw);
          const build = Array.isArray(data) ? data[0] : data;
          console.log(`EAS build id: ${build.id ?? 'unknown'}`);
          console.log(`EAS build status: ${build.status ?? 'queued'}`);
          console.log(`Expected source commit: ${process.env.TARGET_SHA}`);
          if (build.buildDetailsPageUrl) console.log(`Build URL: ${build.buildDetailsPageUrl}`);
          if (!build.id) throw new Error('EAS did not return a build id.');
          NODE
