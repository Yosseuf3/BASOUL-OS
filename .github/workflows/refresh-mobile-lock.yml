name: Refresh mobile lockfile

on:
  push:
    branches:
      - audit/ecosystem-integration-2026-08-30
    paths:
      - mobile/package.json
      - .github/workflows/refresh-mobile-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/ecosystem-integration-2026-08-30
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Refresh lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "mobile/package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Fix: refresh mobile lockfile for Expo 57.0.18 [skip ci]"
          git push origin HEAD:audit/ecosystem-integration-2026-08-30
