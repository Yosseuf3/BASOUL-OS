name: BASOUL Beta 1 Prepare

on:
  push:
    branches:
      - release/basoul-v4.0.0-beta.1

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[beta1-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update canonical release version
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '4.0.0-rc.1'
          new = '4.0.0-beta.1'
          files = [
              'package.json',
              'package-lock.json',
              'mobile/package.json',
              'mobile/package-lock.json',
              'packages/platform/package.json',
              'packages/platform/src/manifest.ts',
              'lib/config/app-info.ts',
              'scripts/check-release-consistency.mjs',
              'app/login/page.tsx',
              'README.md',
              'README_AR.md',
              'mobile/README.md',
              'docs/releases/BASOUL_BETA_1_RELEASE_CHANNEL.md',
          ]
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          manifest = Path('packages/platform/src/manifest.ts')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('channel: "release-candidate"', 'channel: "beta"')
          text = text.replace('authority: "YOSSEUF HQ"', 'authority: "BASOUL HQ"')
          text = text.replace('product: "YOSSEUF OS"', 'product: "BASOUL OS"')
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Add beta release notes
        run: |
          cat > RELEASE_NOTES_v4.0.0-beta.1.md <<'EOF'
          # BASOUL v4.0.0-beta.1

          First official BASOUL Beta release after the ecosystem visual unification and production hardening pass.

          ## Highlights
          - BASOUL visual identity unified across the primary product surfaces.
          - Approved BASOUL Symbol and Wordmark preserved as source assets.
          - Email + Password is the primary development and production login path.
          - Legacy Magic Link root implementation removed from active Web runtime.
          - Mobile login aligned to Email + Password while recovery/deep-link support remains preserved.
          - BASOUL semantic adapter remains separated from canonical YVL mechanics.
          - Legacy OS V1 retired and archived after evidence-based capability review.
          - Legacy AI Core retired and archived after useful patterns were extracted.
          - Copyright ownership standardized to ELSHENAWY RADWAN.
          - BASOUL Beta production deployment verified on Vercel against the Production Supabase project.

          ## Production verification
          - Vercel target: production
          - Root, login, and password recovery surfaces verified with HTTP 200 responses.
          - Production bundle verified against Supabase project `okghyypmkymxvtsuvdvb`.
          - No Supabase Production schema, RLS, Auth policy, signing ID, domain, or external identifier changes are introduced by this release version bump.

          ## Known constraints
          - Physical iOS device signing remains dependent on an active Apple Developer Program team and valid signing credentials.
          - Cloud mobile build quotas/credentials remain external release constraints and are not changed by this release.

          ## Legal
          Copyright © 2026 ELSHENAWY RADWAN. All rights reserved.
          EOF

      - name: Remove preparation-only files
        run: |
          rm -f .github/workflows/basoul-beta1-prepare.yml .release-trigger-beta1

      - name: Install dependencies
        run: npm ci

      - name: Run full quality gate
        run: npm run quality:all

      - name: Commit prepared beta
        run: |
          git config user.name "BASOUL Automation"
          git config user.email "148823738+Yosseuf3@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare BASOUL v4.0.0-beta.1 [beta1-prepared]"
          git push origin HEAD:release/basoul-v4.0.0-beta.1
