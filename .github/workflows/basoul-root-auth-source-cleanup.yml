name: BASOUL Root Auth Source Cleanup

on:
  push:
    branches:
      - agent/basoul-root-auth-source-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[root-auth-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/basoul-root-auth-source-cleanup
          fetch-depth: 0

      - name: Remove legacy root Magic Link source
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text(encoding="utf-8")
          start = text.index("function Auth(){")
          end = text.index("const clamp=", start)
          replacement = '''function Auth(){
            useEffect(()=>{ window.location.replace("/login"); },[]);
            return <LoadingScreen/>;
          }
          function LoadingScreen(){return <div className="center-screen"><div className="loader"><Brain size={38}/><span>جارٍ تشغيل BASOUL…</span></div></div>}

          '''
          updated = text[:start] + replacement + text[end:]
          if "signInWithOtp" in updated or "YOSSEUF OS authentication diagnostics" in updated or "جارٍ تشغيل YOSSEUF OS" in updated:
              raise SystemExit("Legacy root auth markers remain after patch")
          path.write_text(updated, encoding="utf-8")

      - name: Self-remove workflow and commit patch
        run: |
          rm .github/workflows/basoul-root-auth-source-cleanup.yml
          git config user.name "BASOUL Automation"
          git config user.email "148823738+Yosseuf3@users.noreply.github.com"
          git add -A
          git commit -m "fix(auth): remove legacy Magic Link root source [root-auth-cleanup-applied]"
          git push origin HEAD:agent/basoul-root-auth-source-cleanup
