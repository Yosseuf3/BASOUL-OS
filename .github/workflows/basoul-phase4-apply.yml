name: BASOUL Phase 4 Apply

on:
  push:
    branches:
      - migration/basoul-phase-4-web-branding
    paths:
      - .github/workflows/basoul-phase4-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/basoul-phase-4-web-branding
      - name: Apply approved BASOUL web branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/page.tsx'): {
                  'YOSSEUF Platform': 'BASOUL',
              },
              Path('features/architecture/architecture-review-view.tsx'): {
                  'YOSSEUF Architectural Intelligence': 'BASOUL Architectural Intelligence',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text)

          manifest = Path('app/manifest.ts')
          text = manifest.read_text()
          text = text.replace('/icons/yosseuf-os-192.svg', '/icons/basoul-192.png')
          text = text.replace('/icons/yosseuf-os-512.svg', '/icons/basoul-512.png')
          text = text.replace('type: "image/svg+xml"', 'type: "image/png"')
          manifest.write_text(text)
          PY
          mkdir -p public/icons
          cp brand/basoul/assets/app-icons/BASOUL_App_Icon_192.png public/icons/basoul-192.png
          cp brand/basoul/assets/app-icons/BASOUL_App_Icon_512.png public/icons/basoul-512.png
      - name: Verify protected and migrated values
        shell: bash
        run: |
          ! grep -q 'YOSSEUF Platform' app/page.tsx
          ! grep -q 'YOSSEUF Architectural Intelligence' features/architecture/architecture-review-view.tsx
          grep -q 'BASOUL' app/page.tsx
          grep -q 'BASOUL Architectural Intelligence' features/architecture/architecture-review-view.tsx
          grep -q '@yosseuf/yvl-tokens' tsconfig.json
          test -f public/icons/basoul-192.png
          test -f public/icons/basoul-512.png
      - name: Commit applied branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/manifest.ts features/architecture/architecture-review-view.tsx public/icons/basoul-192.png public/icons/basoul-512.png
          if git diff --cached --quiet; then
            echo "Phase 4 changes already applied"
            exit 0
          fi
          git commit -m "feat(brand): apply BASOUL production web identity"
          git push origin HEAD:migration/basoul-phase-4-web-branding
