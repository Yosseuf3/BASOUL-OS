name: Stable Lockfile Sync

on:
  push:
    branches: [release/basoul-v4.0.0]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/basoul-v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Regenerate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfiles
        run: |
          if git diff --quiet -- package-lock.json mobile/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json mobile/package-lock.json
          git commit -m "chore(release): synchronize stable lockfile metadata"
          git push origin HEAD:release/basoul-v4.0.0
