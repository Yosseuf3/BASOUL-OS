name: CAD Gateway

on:
  pull_request:
    paths:
      - 'tools/cad-ingestion/**'
      - 'packages/cad-ingestion/**'
      - 'tests/cad-ingestion.test.mjs'
      - '.github/workflows/cad-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'tools/cad-ingestion/**'
      - 'packages/cad-ingestion/**'
      - 'tests/cad-ingestion.test.mjs'
      - '.github/workflows/cad-gateway.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated CAD gateway
        run: docker build -f tools/cad-ingestion/Dockerfile -t basoul-cad-gateway .
      - name: Verify LibreDWG tools
        run: |
          docker run --rm --entrypoint dwgread basoul-cad-gateway --version
          docker run --rm --entrypoint dwg2dxf basoul-cad-gateway --version
      - name: Verify gateway rejects unsupported input safely
        run: |
          printf 'not a cad file\n' > unsupported.txt
          if docker run --rm -v "$PWD:/work:ro" basoul-cad-gateway /work/unsupported.txt; then
            echo 'Expected unsupported input to fail' >&2
            exit 1
          fi
      - name: Export LibreDWG runtime tools
        run: |
          mkdir -p cad-runtime
          cid="$(docker create basoul-cad-gateway)"
          docker cp "$cid:/usr/local/bin/dwgread" cad-runtime/dwgread
          docker cp "$cid:/usr/local/bin/dwg2dxf" cad-runtime/dwg2dxf
          docker rm "$cid"
          chmod +x cad-runtime/dwgread cad-runtime/dwg2dxf
          sha256sum cad-runtime/* > cad-runtime/SHA256SUMS
      - name: Upload CAD runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: basoul-cad-runtime-linux-x64
          path: cad-runtime/
          if-no-files-found: error
          retention-days: 1
