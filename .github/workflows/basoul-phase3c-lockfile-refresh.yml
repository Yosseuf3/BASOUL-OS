name: BASOUL Phase 3C Lockfile Refresh

on:
  push:
    branches:
      - migration/basoul-phase-3c-package-manifests
    paths:
      - package.json
      - packages/**/package.json
      - .github/workflows/basoul-phase3c-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/basoul-phase-3c-package-manifests
          fetch-depth: 0
      - name: Restore canonical main lockfile and apply namespace-only replacements
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:package-lock.json > package-lock.json
          python - <<'PY'
          from pathlib import Path
          p = Path('package-lock.json')
          s = p.read_text()
          replacements = {
              'yosseuf-platform': 'basoul-platform',
              '@yosseuf/platform': '@basoul/platform',
              '@yosseuf/shared-types': '@basoul/shared-types',
              '@yosseuf/decision-engine': '@basoul/decision-engine',
              '@yosseuf/event-bus': '@basoul/event-bus',
              '@yosseuf/core': '@basoul/core',
              '@yosseuf/services': '@basoul/services',
              '@yosseuf/intelligence': '@basoul/intelligence',
              '@yosseuf/cognitive-core': '@basoul/cognitive-core',
              '@yosseuf/architectural-intelligence': '@basoul/architectural-intelligence',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify protected namespaces remain untouched
        shell: bash
        run: |
          grep -q '"@yosseuf/yvl-tokens"' package-lock.json
          grep -q '"@yosseuf/ui-tokens"' package-lock.json
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(lockfile): sync BASOUL Phase 3C namespace only"
          git push origin HEAD:migration/basoul-phase-3c-package-manifests
