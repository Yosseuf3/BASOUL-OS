name: BASOUL Phase 5 Mobile Branding

on:
  push:
    branches:
      - migration/basoul-phase-5-mobile-branding
    paths:
      - .github/workflows/basoul-phase-5-mobile-branding.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/basoul-phase-5-mobile-branding
          fetch-depth: 0
      - name: Repair mobile UTF-8 presentation strings and apply BASOUL display labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = [Path('mobile/src')]
          markers = ('Ã', 'Ø', 'Ù', 'Â', 'â€')
          repaired = 0
          changed = 0

          for root in roots:
              for path in root.rglob('*.tsx'):
                  text = path.read_text(encoding='utf-8')
                  original = text
                  out = []
                  for line in text.splitlines(keepends=True):
                      candidate = line
                      if any(m in line for m in markers):
                          for enc in ('latin1', 'cp1252'):
                              try:
                                  decoded = line.encode(enc).decode('utf-8')
                                  if decoded != line:
                                      candidate = decoded
                                      repaired += 1
                                      break
                              except (UnicodeEncodeError, UnicodeDecodeError):
                                  pass
                      out.append(candidate)
                  text = ''.join(out)
                  text = text.replace('YOSSEUF Platform · MOBILE', 'BASOUL · MOBILE')
                  text = text.replace('YOSSEUF Platform', 'BASOUL')
                  text = text.replace('YOSSEUF OS ·', 'BASOUL ·')
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed += 1

          print(f'changed files: {changed}; repaired lines: {repaired}')
          PY

          ! grep -R -n -E 'YOSSEUF Platform|YOSSEUF OS ·' mobile/src --include='*.tsx'
          ! grep -R -n -E 'Ã.|Ø.|Ù.|Â.|â€' mobile/src --include='*.tsx'
          grep -R -n 'BASOUL' mobile/src --include='*.tsx'
      - name: Commit phase 5 mobile presentation changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src
          if git diff --cached --quiet; then
            echo 'No mobile presentation changes required'
            exit 0
          fi
          git commit -m "feat(mobile): apply BASOUL presentation identity and repair UTF-8"
          git push origin HEAD:migration/basoul-phase-5-mobile-branding
