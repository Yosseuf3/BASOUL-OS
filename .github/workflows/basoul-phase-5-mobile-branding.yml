name: BASOUL Phase 5 Mobile Branding

on:
  push:
    branches:
      - migration/basoul-phase-5-mobile-branding
    paths:
      - .github/workflows/basoul-phase-5-mobile-branding.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/basoul-phase-5-mobile-branding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply BASOUL mobile presentation identity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet ftfy
          python - <<'PY'
          from pathlib import Path
          from ftfy import fix_text
          import json

          for path in Path('mobile/src').rglob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              original = text
              for _ in range(5):
                  fixed = fix_text(text)
                  if fixed == text:
                      break
                  text = fixed
              text = text.replace('YOSSEUF Platform · MOBILE', 'BASOUL · MOBILE')
              text = text.replace('YOSSEUF Platform', 'BASOUL')
              text = text.replace('YOSSEUF OS ·', 'BASOUL ·')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          app_path = Path('mobile/app.json')
          app = json.loads(app_path.read_text(encoding='utf-8'))
          expo = app['expo']
          expo['name'] = 'BASOUL'
          expo['icon'] = './assets/icon.png'
          expo['extra']['product'] = 'BASOUL'
          app_path.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          mkdir -p mobile/assets
          cp brand/basoul/assets/app-icons/BASOUL_App_Icon_1024.png mobile/assets/icon.png

          ! grep -R -n -E 'YOSSEUF Platform|YOSSEUF OS ·' mobile/src --include='*.tsx'
          grep -R -n 'BASOUL' mobile/src --include='*.tsx'
          grep -q '"name": "BASOUL"' mobile/app.json
          grep -q '"icon": "./assets/icon.png"' mobile/app.json
      - name: Commit phase 5 mobile presentation changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src mobile/app.json mobile/assets/icon.png
          if git diff --cached --quiet; then
            echo 'No mobile presentation changes required'
            exit 0
          fi
          git commit -m "feat(mobile): apply BASOUL mobile identity and approved app icon"
          git push origin HEAD:migration/basoul-phase-5-mobile-branding
