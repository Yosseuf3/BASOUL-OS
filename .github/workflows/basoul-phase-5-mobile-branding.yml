name: BASOUL Phase 5 Mobile Branding

on:
  push:
    branches:
      - migration/basoul-phase-5-mobile-branding
    paths:
      - .github/workflows/basoul-phase-5-mobile-branding.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/basoul-phase-5-mobile-branding
          fetch-depth: 0
      - name: Repair mobile UTF-8 presentation strings and apply BASOUL display labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          markers = ('Ã', 'Ø', 'Ù', 'Â', 'â€', 'â€¦', 'â€”')

          def marker_score(s: str) -> int:
              return sum(s.count(m) for m in markers)

          def repair_line(line: str) -> str:
              current = line
              for _ in range(4):
                  if marker_score(current) == 0:
                      break
                  best = current
                  best_score = marker_score(current)
                  for enc in ('latin1', 'cp1252'):
                      try:
                          candidate = current.encode(enc).decode('utf-8')
                      except (UnicodeEncodeError, UnicodeDecodeError):
                          continue
                      score = marker_score(candidate)
                      if score < best_score:
                          best, best_score = candidate, score
                  if best == current:
                      break
                  current = best
              return current

          changed = 0
          for path in Path('mobile/src').rglob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = ''.join(repair_line(line) for line in text.splitlines(keepends=True))
              text = text.replace('YOSSEUF Platform · MOBILE', 'BASOUL · MOBILE')
              text = text.replace('YOSSEUF Platform', 'BASOUL')
              text = text.replace('YOSSEUF OS ·', 'BASOUL ·')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f'changed files: {changed}')
          PY

          ! grep -R -n -E 'YOSSEUF Platform|YOSSEUF OS ·' mobile/src --include='*.tsx'
          ! grep -R -n -E 'Ã.|Ø.|Ù.|Â.|â€|â€¦|â—' mobile/src --include='*.tsx'
          grep -R -n 'BASOUL' mobile/src --include='*.tsx'
      - name: Commit phase 5 mobile presentation changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src
          if git diff --cached --quiet; then
            echo 'No mobile presentation changes required'
            exit 0
          fi
          git commit -m "feat(mobile): apply BASOUL presentation identity and repair UTF-8"
          git push origin HEAD:migration/basoul-phase-5-mobile-branding
